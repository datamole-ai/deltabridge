name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Explicit version to release, e.g. 1.0.0. Leave empty to derive the
          version automatically from conventional commits since the last tag.
        required: false
        type: string

env:
  CHANGELOG_FILE: CHANGELOG.md
  FULL_CHANGELOG_FILE: FULL_CHANGELOG.md
  README_FILE: README.md
  PACKAGE_NAME: deltabridge
  PACKAGE_PATH: deltabridge

jobs:
  release:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: publish-package
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.11
      - name: Install convco
        env:
          CONVCO_VERSION: v0.6.2
        run: |
          curl -sSfL "https://github.com/convco/convco/releases/download/${{ env.CONVCO_VERSION }}/convco-ubuntu.zip" | zcat > /usr/local/bin/convco
          chmod +x /usr/local/bin/convco
      - name: Set variables
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base_version_command="
            convco
            version
            --prefix=v
            --paths=${{ env.PACKAGE_PATH }}/
            --paths=pyproject.toml
            --paths=${{ env.README_FILE }}
          "
          old_version=$($base_version_command)
          if [ -n "$INPUT_VERSION" ]; then # explicit version requested
            new_version="$INPUT_VERSION"
          elif [ $old_version = "0.0.0" ]; then # i.e. there is no version yet
            new_version="0.1.0"
          else
            new_version=$($base_version_command --bump)
          fi
          new_tag="v$new_version"
          release_name=${{ env.PACKAGE_NAME }}/"$new_version"
          package_path=${{ env.PACKAGE_PATH }}
          echo "OLD_VERSION=$old_version" >> $GITHUB_ENV
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV
          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV
          echo "PACKAGE_PATH=$package_path" >> $GITHUB_ENV
          echo "old version: $old_version"
          echo "new version: $new_version"
          echo "new tag: $new_tag"
          echo "packages path: $package_path"
      - name: Create changelogs and build
        if: ${{ env.OLD_VERSION != env.NEW_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ########################################
          # Generate changelogs
          ########################################
          base_changelog_command="
            convco
            changelog
            --prefix=v
            --paths=${{ env.PACKAGE_PATH }}/
            --paths=pyproject.toml
            --paths=${{ env.README_FILE }}
            --unreleased=${{ env.NEW_TAG }}
          "
          $base_changelog_command --max-versions=1 > ${{ env.CHANGELOG_FILE }}
          $base_changelog_command > ${{ env.FULL_CHANGELOG_FILE }}
          ########################################
          # Build Package
          ########################################
          uv version ${{ env.NEW_VERSION }}
          uv build
      - name: Publish to Pypi
        if: ${{ env.OLD_VERSION != env.NEW_VERSION }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        if: ${{ env.OLD_VERSION != env.NEW_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            ${{ env.NEW_TAG }} \
            --title ${{ env.RELEASE_NAME }} \
            --notes-file ${{ env.CHANGELOG_FILE }} \
            ${{ env.FULL_CHANGELOG_FILE }}
