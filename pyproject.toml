[project]
name = "deltabridge"
version = "0"  # Do not change - managed by CI
license = "MIT"
license-files = ["LICENSE"]
description = "Thin Python wrapper for reading Delta tables from Azure Blob Storage with low and stable latency."
authors = [
    {name = "Juraj Pall", email = "juraj.pall@datamole.ai"},
    {name = "Michal Belak", email = "michal.belak@datamole.ai"},
    {name = "Jan Lukany", email = "jan.lukany@datamole.ai"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "azure-identity>=1.17.1",
    # Explicit floor (also pulled in by polars[deltalake], unpinned):
    # deltalake 1.5.0 replayed the whole transaction log in
    # update_incremental (delta-io/delta-rs#4276); the 1.5.1 fix
    # introduced a memory regression (delta-io/delta-rs#4422) that was
    # only fixed in 1.6.0.
    "deltalake>=1.6.0",
    # polars gained deletion-vector read support in polars 1.40.0
    # (pola-rs/polars#26867);
    "polars[deltalake]>=1.40.0,<2.0.0"
]
readme = "README.md"
keywords = [
    "delta",
    "delta-lake",
    "deltalake",
    "delta-rs",
    "polars",
    "azure",
    "blob-storage",
    "data-engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/datamole-ai/deltabridge"


[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-mock~=3.8",
    "ruff~=0.11",
]

[tool.ruff]
line-length = 79
target-version = "py312"
lint.select = [
    "E",
    "F",
    "N",
    "W",
    "I001",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"*/**" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["deltabridge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
